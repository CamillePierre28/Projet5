# Ce workflow GitHub Actions automatise l’intégration continue (tests) et le déploiement continu en exécutant les tests unitaires
# à chaque modification, puis en déployant automatiquement le projet vers
# un espace Hugging Face si les tests réussissent sur les branches principales.

# Workflow CI/CD : exécute les tests et déploie automatiquement le projet

name: CI/CD - Tests and Deploy

# Déclenchement du workflow
on:
  push:
    branches:
      - main
      - develop
      - feature/**    # Toutes les branches de type feature/*
  pull_request:
    branches:
      - main
      - develop

jobs:
  # Job de CI : exécution des tests
  tests:
    name: CI - Tests
    runs-on: ubuntu-latest    # Machine virtuelle Linux

    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4   # Récupère le code du repo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"    # Installe Python 3.12

      - name: Install uv
        run: pip install uv   # Installe uv (gestionnaire de dépendances rapide)

      - name: Install dependencies
        run: uv sync --dev    # Installe les dépendances (incluant dev)

      - name: Run unit tests
        run: uv run pytest -q   # Lance les tests unitaires

  # Job de CD : déploiement automatique
  deploy:
    name: CD - Deploy to Hugging Face Spaces
    runs-on: ubuntu-latest

    # Ce job dépend de la réussite des tests
    needs: tests

    # Exécuté uniquement sur push vers main ou develop
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'develop')

    # Définit l'environnement (production ou staging)
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4   # Récupère le code

      - name: Setup Git identity
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions"

      - name: Install git-lfs
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install

      - name: Clone Hugging Face Space repo
        run: |
          git clone https://huggingface.co/spaces/${{ vars.HF_SPACE_REPO }} hf_space

      - name: Sync project files into Space
        run: |
          rsync -av --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude ".venv" \
            --exclude "__pycache__" \
            --exclude "hf_space/" \
            ./ hf_space/ || true

      - name: Commit & push to Hugging Face Space
        working-directory: hf_space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git add -A
          git commit -m "Deploy from GitHub: $GITHUB_SHA" || echo "No changes to commit"
          git push https://user:${HF_TOKEN}@huggingface.co/spaces/${{ vars.HF_SPACE_REPO }} main